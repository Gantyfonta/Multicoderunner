<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code Runner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
      transition: background 0.2s;
    }
    h1 {
      text-align: center;
    }
    textarea, select {
      width: 100%;
      font-family: monospace;
      font-size: 16px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    textarea {
      height: 200px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      margin-right: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
    }
    #output {
      margin-top: 20px;
      background: #eee;
      padding: 10px;
      white-space: pre-wrap;
      border-radius: 8px;
    }
    iframe, video {
      width: 100%;
      margin-top: 20px;
      border-radius: 8px;
    }
    #settingsPanel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      display: none;
      z-index: 1000;
      border-radius: 10px;
    }
    #settingsPanel label {
      display: block;
      margin-top: 5px;
    }
    #fullscreenBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <button onclick="toggleSettings()" style="position: fixed; top: 10px; left: 10px; z-index: 1001;">⚙️ Settings</button>
  <button id="fullscreenBtn" onclick="toggleFullscreen()">🖵 Fullscreen</button>

  <div id="settingsPanel">
    <strong>Customize Colors</strong>
    <label>Background R: <input type="range" min="0" max="255" id="bgR"></label>
    <label>Background G: <input type="range" min="0" max="255" id="bgG"></label>
    <label>Background B: <input type="range" min="0" max="255" id="bgB"></label>
    <label>Border R: <input type="range" min="0" max="255" id="borderR"></label>
    <label>Border G: <input type="range" min="0" max="255" id="borderG"></label>
    <label>Border B: <input type="range" min="0" max="255" id="borderB"></label>
    <button onclick="applyColors()">Apply</button>
    <button onclick="resetColors()">Reset</button>
    <hr/>
    <button onclick="activateFunMode()">🎉 Fun Mode</button>
  </div>

  <h1>Code Runner (Python, JavaScript, HTML & Media)</h1>
  <label for="language">Select Language:</label>
  <select id="language">
    <option value="python">Python</option>
    <option value="javascript">JavaScript</option>
    <option value="html">HTML</option>
    <option value="link">Link</option>
    <option value="video">Video</option>
  </select>
  <textarea id="code" placeholder="Type your code or link here..."></textarea><br/>
  <button onclick="runCode()">Run</button>
  <button onclick="refreshContent()">Refresh</button>
  <div id="output">Loading Pyodide...</div>
  <div id="renderArea"></div>

  <!-- Load Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <script>
    let pyodideReadyPromise = loadPyodide();

    async function runCode() {
      const output = document.getElementById('output');
      const renderArea = document.getElementById('renderArea');
      const code = document.getElementById('code').value;
      const language = document.getElementById('language').value;
      output.textContent = "Running...";
      renderArea.innerHTML = "";

      if (language === "python") {
        try {
          const pyodide = await pyodideReadyPromise;
          let result = await pyodide.runPythonAsync(code);
          output.textContent = result === undefined ? "Code executed (no output)." : result;
        } catch (err) {
          output.textContent = "Error:\n" + err;
        }
      } else if (language === "javascript") {
        try {
          let result = eval(code);
          output.textContent = result === undefined ? "Code executed (no output)." : result;
        } catch (err) {
          output.textContent = "Error:\n" + err;
        }
      } else if (language === "html") {
        output.textContent = "Rendering HTML...";
        renderArea.innerHTML = code;
      } else if (language === "link") {
        output.textContent = "Loading external website...";
        renderArea.innerHTML = `<iframe src="${code}" height="500" style="border:1px solid #ccc;"></iframe>`;
      } else if (language === "video") {
        output.textContent = "Loading video...";
        renderArea.innerHTML = `<video controls><source src="${code}" type="video/mp4">Your browser does not support the video tag.</video>`;
      }
    }

    function refreshContent() {
      runCode();
    }

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function applyColors() {
      const bgR = document.getElementById('bgR').value;
      const bgG = document.getElementById('bgG').value;
      const bgB = document.getElementById('bgB').value;
      const borderR = document.getElementById('borderR').value;
      const borderG = document.getElementById('borderG').value;
      const borderB = document.getElementById('borderB').value;

      const bgColor = `rgb(${bgR}, ${bgG}, ${bgB})`;
      const borderColor = `rgb(${borderR}, ${borderG}, ${borderB})`;
      localStorage.setItem("bgColor", bgColor);
      localStorage.setItem("borderColor", borderColor);

      document.body.style.backgroundColor = bgColor;
      document.querySelectorAll('iframe').forEach(frame => {
        frame.style.borderColor = borderColor;
      });
    }

    function resetColors() {
      localStorage.removeItem("bgColor");
      localStorage.removeItem("borderColor");
      location.reload();
    }

    function loadSavedColors() {
      const bgColor = localStorage.getItem("bgColor");
      const borderColor = localStorage.getItem("borderColor");
      if (bgColor) document.body.style.backgroundColor = bgColor;
      if (borderColor) document.querySelectorAll('iframe').forEach(frame => {
        frame.style.borderColor = borderColor;
      });
    }

    function toggleFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        el.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function activateFunMode() {
      document.body.style.fontFamily = 'Comic Sans MS, cursive, sans-serif';
      let hue = 0;
      setInterval(() => {
        document.body.style.background = `hsl(${hue}, 100%, 85%)`;
        hue = (hue + 5) % 360;
      }, 20);
    }

    pyodideReadyPromise.then(() => {
      document.getElementById('output').textContent = "Ready to run Python, JavaScript, HTML, and media.";
      loadSavedColors();
    });
  </script>
</body>
</html>
